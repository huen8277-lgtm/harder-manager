
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>하더 센터 운영관리 - HTML 버전</title>
<style>
  :root{
    --bg:#f5f7fb;
    --panel:#ffffff;
    --line:#d9e1ec;
    --line2:#e7edf5;
    --text:#1f2937;
    --muted:#6b7280;
    --primary:#1d4ed8;
    --primary-soft:#e8f0ff;
    --success:#0f766e;
    --warning:#b45309;
    --danger:#b91c1c;
    --shadow:0 10px 30px rgba(15, 23, 42, .08);
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:linear-gradient(180deg, #f7f9fd 0%, #eef3f9 100%);
    color:var(--text);
    font-family:Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  html, body, .app, .card, .table-wrap{overflow-anchor:none;}
  .app{max-width:1700px;margin:0 auto;padding:24px}
  .topbar{
    display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .brand{
    display:flex;flex-direction:column;gap:6px;
  }
  .brand h1{margin:0;font-size:28px;letter-spacing:-0.03em}
  .brand p{margin:0;color:var(--muted)}
  .pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .pill{
    background:var(--primary-soft);
    color:var(--primary);
    border:1px solid #cfe0ff;
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:700;
  }
  .actions{
    display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap
  }
  .top-actions-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,160px)) minmax(280px,1fr);
    gap:8px;
    align-items:start;
    width:100%;
    max-width:1120px;
  }
  .top-actions-grid .control{min-width:0;}
  .compact-field{padding:10px 11px;}
  .compact-field input{min-height:38px;}
  .manage-accordion{
    padding:10px 11px;
  }
  .manage-accordion > summary{
    list-style:none;
    cursor:pointer;
    font-weight:800;
    font-size:12px;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    user-select:none;
  }
  .manage-accordion > summary::-webkit-details-marker{display:none;}
  .manage-accordion > summary::after{
    content:'▾';
    color:var(--muted);
    font-size:12px;
  }
  .manage-accordion[open] > summary::after{content:'▴';}
  .manage-panel{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);
    gap:8px;
    margin-top:10px;
    align-items:start;
  }
  .mini-group{
    border:1px solid var(--line2);
    border-radius:12px;
    background:#fbfdff;
    padding:10px;
  }
  .mini-group .mini-title{
    font-size:11px;
    font-weight:800;
    color:var(--muted);
    margin-bottom:8px;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .mini-buttons{display:flex;gap:8px;flex-wrap:wrap}
  .mini-buttons .btn{min-height:34px;padding:7px 10px;}
  .sync-mini{display:grid;gap:8px;}
  .sync-mini .small{margin-bottom:0 !important;}
  .sync-mini input{min-height:36px;}
  .control{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    box-shadow:var(--shadow);
  }
  .control label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .control input,.control select,.control textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 10px;
    font:inherit;
    background:#fff;
    color:var(--text);
    outline:none;
  }
  .control input:focus,.control select:focus,.control textarea:focus{
    border-color:#9db7ff; box-shadow:0 0 0 3px rgba(59,130,246,.12)
  }
  .tabs{
    display:flex;gap:8px;flex-wrap:wrap;
    margin:16px 0;
  }
  .tab{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    border-radius:999px;
    padding:10px 14px;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(15,23,42,.04);
    font-weight:700;
  }
  .tab.active{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:16px;
  }
  .kpis{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:12px;
  }
  @media (max-width: 1200px){
    .kpis{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media (max-width: 700px){
    .kpis{grid-template-columns:1fr;}
  }
  .kpi{
    background:linear-gradient(180deg, #fff 0%, #fbfcff 100%);
    border:1px solid var(--line2);
    border-radius:16px;
    padding:16px;
  }
  .kpi .label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .kpi .value{font-size:24px;font-weight:800;letter-spacing:-0.03em}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:6px}
  .sheet{
    display:none;
    animation:fade .15s ease-out;
  }
  .sheet.active{display:block}
  @keyframes fade{from{opacity:.6;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
  .section-title{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-bottom:10px
  }
  .section-title h2{margin:0;font-size:20px;letter-spacing:-0.02em}
  .section-title .note{color:var(--muted);font-size:13px}
  .table-wrap{
    overflow:auto;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    min-width:100%;
  }
  th, td{
    border-bottom:1px solid var(--line2);
    padding:8px 10px;
    vertical-align:middle;
    white-space:nowrap;
  }
  thead th{
    position:sticky;
    top:0;
    z-index:2;
    background:#f8fbff;
    font-size:13px;
    text-align:left;
    border-bottom:1px solid var(--line);
  }
  tbody tr:hover td{background:#fbfdff}
  td.input-cell input, td.input-cell select, td.input-cell textarea{
    width:100%;
    min-width:110px;
    border:1px solid #d7e2f0;
    border-radius:10px;
    padding:8px 9px;
    font:inherit;
    background:#fff;
  }
  td.input-cell textarea{min-width:180px;min-height:38px;resize:vertical}
  td.computed{
    background:#f8fafc;
    color:#0f172a;
    font-weight:700;
  }
  td.muted{color:var(--muted)}
  .small{font-size:12px;color:var(--muted)}
  .section-grid{
    display:grid;gap:14px;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  @media (max-width: 1100px){
    .section-grid{grid-template-columns:1fr;}
  }
  .subcard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
  }
  .subcard h3{margin:0 0 10px 0;font-size:16px}
  .btn{
    border:1px solid var(--line);
    background:#fff;
    padding:9px 12px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
  }
  .btn.primary{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
  }
  .btn.ghost{
    background:#fff;
  }
  .row-tools{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px
  }
  .tag{
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;
    font-size:12px;font-weight:700;border:1px solid var(--line);
  }
  .tag.success{background:#ecfdf5;color:var(--success);border-color:#a7f3d0}
  .tag.warning{background:#fffbeb;color:var(--warning);border-color:#fde68a}
  .tag.danger{background:#fef2f2;color:var(--danger);border-color:#fecaca}
  .tag.neutral{background:#f8fafc;color:#334155;border-color:#dbe5f1}
  .notes-list{
    display:grid;gap:10px;line-height:1.65
  }
  .notes-list ul{margin:0;padding-left:18px}
  .notes-list li{margin:4px 0}
  .muted-box{
    background:#f8fbff;border:1px solid #dce8f8;border-radius:14px;padding:12px;color:#475569
  }
  .footer-space{height:40px}
  .right{margin-left:auto}
  .mini-input{width:110px}
  .currency{text-align:right}
  .center{text-align:center}
  .status-badge{
    display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700
  }
  .s-이용중{background:#ecfdf5;color:#047857}
  .s-예정{background:#eff6ff;color:#1d4ed8}
  .s-만료{background:#fef3c7;color:#92400e}
  .s-소진{background:#fee2e2;color:#b91c1c}
  .s-재등록필요{background:#ffedd5;color:#c2410c}
  .s-입력전{background:#f3f4f6;color:#4b5563}
  .member-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:12px 0 14px}
  .filter-item{display:flex;flex-direction:column;gap:6px;min-width:170px}
  .filter-item label{font-size:12px;font-weight:700;color:#6b7280}
  .filter-item select{width:100%;min-width:170px}
  .sheet-controls{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px
  }
  .sheet-controls .control{box-shadow:none}
  .sticky-top{
    position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
    background:rgba(245,247,251,.82);padding-bottom:10px;
  }
  .nowrap{white-space:nowrap}

  .chart-grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));}
  @media (max-width: 1100px){.chart-grid{grid-template-columns:1fr;}}
  .chart-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;}
  .chart-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .chart-head h3{margin:0;font-size:16px;}
  .series-toggles{display:flex;gap:8px;flex-wrap:wrap}
  .coach-inline{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;max-width:100%;}
  .coach-inline .coach-label{font-weight:600;color:#111827;}
  .coach-inline .coach-rate{font-weight:700;color:#374151;}
  .coach-inline select{min-width:150px;max-width:180px;}
  .coach-toggles{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .series-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;user-select:none;}
  .series-toggle input{margin:0}
  .chart-wrap{position:relative;width:100%;height:300px;border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);overflow:hidden;}
  .chart-grid{align-items:stretch;}
  .chart-card{display:flex;flex-direction:column;height:100%;}
  .chart-card .chart-wrap{flex:0 0 300px;}
  .chart-stats{margin-top:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:#f8fbff;display:flex;gap:14px;flex-wrap:wrap;}
  .chart-stat{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted);}
  .chart-stat strong{font-size:14px;color:var(--text);}
  .chart-month-table{margin-top:10px;}
  .chart-month-table table{min-width:0;}
  .chart-month-table th,.chart-month-table td{font-size:12px;padding:7px 9px;}

  .chart-canvas{width:100%;height:100%;display:block;}
  .legend-note{font-size:12px;color:var(--muted);}
  .positive,.signed-positive{color:#dc2626;font-weight:800;}
  .negative,.signed-negative{color:#2563eb;font-weight:800;}


  /* Cleaner UI overrides */
  body{
    background:linear-gradient(180deg, #f8fafc 0%, #eef3f9 100%);
  }
  .app{
    max-width:1640px;
    padding:20px;
  }
  .sticky-top{
    position:sticky;
    top:0;
    z-index:20;
    backdrop-filter:blur(12px);
    background:rgba(248,250,252,.86);
    padding:14px 0 12px;
    margin:0 -20px 10px;
    padding-left:20px;
    padding-right:20px;
    border-bottom:1px solid rgba(217,225,236,.75);
  }
  .topbar{
    gap:12px;
    margin-bottom:14px;
    align-items:center;
  }
  .brand h1{
    font-size:26px;
    line-height:1.15;
  }
  .brand p{font-size:13px;}
  .actions{
    gap:10px;
    align-items:stretch;
  }
  .control{
    box-shadow:none;
    border-radius:16px;
    padding:12px 13px;
    min-width:unset;
  }
  .control label{
    margin-bottom:8px;
    font-size:11px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .control input,.control select,.control textarea{
    border-radius:11px;
    min-height:40px;
    background:#fff;
  }
  .control input::placeholder,.control textarea::placeholder{color:#94a3b8;}
  .btn{
    border-radius:11px;
    min-height:38px;
    padding:9px 12px;
    box-shadow:none;
    transition:transform .06s ease, box-shadow .12s ease, border-color .12s ease, background-color .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .tabs{
    margin:12px 0 0;
    padding-bottom:2px;
  }
  .tab{
    border-radius:999px;
    padding:9px 13px;
    box-shadow:none;
    background:#fff;
  }
  .card{
    border-radius:22px;
    padding:20px;
    margin-bottom:14px;
  }
  .section-title{
    margin-bottom:12px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line2);
  }
  .section-title h2{font-size:19px;}
  .section-title .note{font-size:12px;}
  .subcard{
    border-radius:18px;
    background:#fbfdff;
  }
  .subcard h3{font-size:15px;}
  .kpis{
    gap:10px;
  }
  .kpi{
    border-radius:18px;
    padding:15px;
  }
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:.02em;}
  .kpi .value{font-size:22px;}
  .table-wrap{
    border-radius:16px;
    box-shadow:none;
    background:#fff;
  }
  th, td{
    padding:9px 11px;
    font-size:13px;
  }
  thead th{
    background:#f8fbff;
    font-size:12px;
    letter-spacing:.01em;
  }
  tbody tr:hover td{background:#f8fbff;}
  td.input-cell input, td.input-cell select, td.input-cell textarea{
    min-width:100px;
    border-radius:10px;
    padding:7px 9px;
  }
  td.input-cell textarea{min-width:160px;}
  .sheet-controls .control,
  .member-filters .filter-item{
    box-shadow:none;
  }
  .chart-card{
    border-radius:18px;
    padding:12px;
  }
  .chart-wrap{
    border-radius:12px;
  }
  .chart-head h3{font-size:15px;}
  .legend-note{font-size:11px;}
  .status-badge{padding:4px 8px;}
  .small{line-height:1.55;}
  .notes-list{line-height:1.6;}
  .muted-box{border-radius:12px;}
  .footer-space{height:24px;}


  .member-summary-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px;}
  .member-summary-strip>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line2);border-radius:12px;background:#f8fbff;}
  .member-summary-strip span{font-size:11px;color:var(--muted);font-weight:700;}
  .member-summary-strip strong{font-size:15px;}
  .member-history-row.member-reregister-row td{background:#fcfdff;}
  .member-reregister-row td:first-child{box-shadow:inset 3px 0 0 #cbd5e1;}
  .member-round-badge{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--line2);white-space:nowrap;}
  .member-round-badge.new{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
  .member-round-badge.re{background:#f8fafc;color:#475569;border-color:#cbd5e1;}
  .member-row-actions{display:flex;align-items:center;justify-content:center;gap:5px;}
  .btn-reregister{font-size:11px;padding:6px 8px;min-height:30px;}
  @media (max-width:900px){.member-summary-strip{grid-template-columns:repeat(2,minmax(0,1fr));}}
</style>

function makeMemberGroupId(){

function memberIdentityKey(m){

function ensureMemberGroups(){
  if (!Array.isArray(state.members)) return;
  const groups = new Map();
  for (const m of state.members){
    if (m.memberGroupId) {
      groups.set(m.memberGroupId, true);
      if (m.regType === '신규' && !m.regRound) m.regRound = 0;
      continue;
    }
  }
  const keyToGroup = new Map();
  for (const m of state.members){
    const key = memberIdentityKey(m);
    const type = String(m.regType || '').trim();
    if (m.memberGroupId){
      if (key && !keyToGroup.has(key)) keyToGroup.set(key, m.memberGroupId);
      continue;
    }
    if (type === '재등록' && key && keyToGroup.has(key)) {
      m.memberGroupId = keyToGroup.get(key);
      const gRows = state.members.filter(x => x.memberGroupId === m.memberGroupId);
      const maxRound = gRows.reduce((mx, x) => Math.max(mx, Number(x.regRound) || 0), 0);
      m.regRound = maxRound + 1;
    } else {
      m.memberGroupId = makeMemberGroupId();
      m.regRound = 0;
      if (!type) m.regType = '신규';
      if (key) keyToGroup.set(key, m.memberGroupId);
    }
  }
  // Second pass: legacy rows with same group but missing round get stable ordering.
  const byGroup = new Map();
  state.members.forEach((m, idx) => {
    if (!m.memberGroupId) return;
    if (!byGroup.has(m.memberGroupId)) byGroup.set(m.memberGroupId, []);
    byGroup.get(m.memberGroupId).push({m, idx});
  });
  byGroup.forEach(rows => {
    rows.sort((a,b) => a.idx - b.idx);
    let max = -1;
    rows.forEach(({m}, i) => {
      if (m.regType === '재등록') {
        if (!(Number.isFinite(Number(m.regRound)) && Number(m.regRound) > 0)) m.regRound = i || 1;
        max = Math.max(max, Number(m.regRound));
      } else {
        m.regRound = 0;
      }
    });
  });
}

function scheduleRecalc(force = false, delay = 650){
  const active = typeof document !== 'undefined' ? document.activeElement : null;
  const editingText = isTextEditingElement(active);

  if ((isComposing || editingText) && !force) {
    if (isComposing) pendingDuringComposition = true;

  pendingDuringComposition = false;
  pendingTextRender = false;
  if (recalcTimer) clearTimeout(recalcTimer);
  recalcTimer = setTimeout(() => {
    recalcTimer = 0;

}

function memberIncomeRows(){
  return state.members.map((m, idx) => {
    const d = memberDerived(m, idx);
    const priceRow = getPrice(m.product);
    const price = priceRow ? Number(priceRow.price) || 0 : 0;
    const received = price;
    return {
      date: fmtDate(m.start),
      name: m.name || '',
      id: d.id,
      product: m.product || '',
      price,
      discount: 0,
      received,
      method: '',
      coach: m.coach || '',
      type: '회원권',
      note: m.regType || '',
    };
  });
}
function extraIncomeRows(){
  return state.manualIncomes.map(row => ({
    date: row.date || '',
    item: row.item || '',
    amount: Number(row.amount) || 0,
    method: row.method || '',
    coach: row.coach || '',
    type: row.type || '기타',
    note: row.note || '',
  })).filter(r => r.date || r.item || r.amount || r.method || r.coach || r.type || r.note);
}
function revenueSummaryForMonth(year, monthIndex){
  const { start, end } = monthRange(year, monthIndex);
  const memberRevenue = memberIncomeRows().reduce((sum, r) => sum + (inRange(r.date, start, end) ? (Number(r.received)||0) : 0), 0);
  const otherRevenue = extraIncomeRows().reduce((sum, r) => sum + (inRange(r.date, start, end) ? (Number(r.amount)||0) : 0), 0);
  return { memberRevenue, otherRevenue, totalRevenue: memberRevenue + otherRevenue };
}
function expenseSummaryForMonth(year, monthIndex){
  const { start, end } = monthRange(year, monthIndex);
  const cats = ['임대료','관리비','인건비','광고비','소모품비','기타'];
  const out = Object.fromEntries(cats.map(c => [c, 0]));
  state.expenses.forEach(r => {
    if (!inRange(r.date, start, end)) return;
    const amt = Number(r.amount) || 0;
    if (cats.includes(r.category)) out[r.category] += amt;
    else out['기타'] += amt;
  });
  const totalExpense = Object.values(out).reduce((a,b)=>a+b,0);
  return {...out, totalExpense};
}
function annualSummary(){
  const y = Number(state.year) || new Date().getFullYear();
  const months = Array.from({length:12}, (_,i) => {
    const rev = revenueSummaryForMonth(y,i);
    const exp = expenseSummaryForMonth(y,i);
    const profit = rev.totalRevenue - exp.totalExpense;
    const margin = rev.totalRevenue ? profit / rev.totalRevenue : 0;
    return {rev, exp, profit, margin};
  });
  return months;
}
function memberGroups(){
  ensureMemberGroups();
  const map = new Map();
  state.members.forEach((m, idx) => {
    if (!(m.name || '').trim() && !(m.phone || '').trim() && !m.memberGroupId) return;
    const gid = m.memberGroupId || `legacy-${idx}`;
    if (!map.has(gid)) map.set(gid, []);
    map.get(gid).push({m, idx});
  });
  return [...map.entries()].map(([groupId, rows]) => {
    rows.sort((a,b) => {
      const ar = Number(a.m.regRound) || 0;
      const br = Number(b.m.regRound) || 0;
      return ar - br || a.idx - b.idx;
    });
    return {groupId, rows};
  });
}
function currentMemberRows(){
  return memberGroups().map(g => g.rows[g.rows.length - 1]).filter(Boolean);
}
function totalMemberCount(){
  return memberGroups().filter(g => g.rows.some(r => (r.m.name || '').trim())).length;
}
function activeMemberCount(){
  return currentMemberRows().filter(r => memberDerived(r.m, r.idx).status === '이용중').length;
}
function expiredMemberCount(){
  return currentMemberRows().filter(r => memberDerived(r.m, r.idx).status === '만료').length;
}
function soldOutMemberCount(){
  return currentMemberRows().filter(r => memberDerived(r.m, r.idx).status === '소진').length;
}
function revenueYTD(){
  const y = Number(state.year) || new Date().getFullYear();
  const months = annualSummary();
  return months.reduce((a,m)=>a + m.rev.totalRevenue, 0);
}
function expenseYTD(){
  const months = annualSummary();
  return months.reduce((a,m)=>a + m.exp.totalExpense, 0);
}
function profitYTD(){
  return revenueYTD() - expenseYTD();
}
function marginYTD(){
  const rev = revenueYTD();
  return rev ? profitYTD() / rev : 0;
}


function memberRegistrationType(m, idx){
  const explicit = (m.regType || '').trim();
  if (explicit) return explicit;
  const name = (m.name || '').trim();
  const phone = (m.phone || '').trim();
  if (!name && !phone) return '';
  for (let i = 0; i < idx; i++){
    const prev = state.members[i] || {};
    const prevName = (prev.name || '').trim();
    const prevPhone = (prev.phone || '').trim();
    if ((name && prevName && name === prevName) || (phone && prevPhone && phone === prevPhone)){
      return '재등록';
    }
  }
  return '신규';
}
function memberRegistrationStats(){
  const groups = memberGroups();
  const newCount = groups.filter(g => g.rows.some(r => (r.m.name || '').trim() || (r.m.phone || '').trim())).length;
  const reCount = groups.reduce((sum, g) => sum + Math.max(0, g.rows.length - 1), 0);
  const total = newCount + reCount;
  return { newCount, reCount, total, rate: total ? reCount / total : 0 };
}
function coachRegistrationStats(coach){
  const groups = memberGroups().filter(g => g.rows.some(r => (r.m.coach || '').trim() === coach && ((r.m.name || '').trim() || (r.m.phone || '').trim())));
  const newCount = groups.filter(g => {
    const first = g.rows[0]?.m || {};
    return (first.coach || '').trim() === coach && ((first.name || '').trim() || (first.phone || '').trim());
  }).length;
  const reCount = groups.reduce((sum, g) => sum + g.rows.filter(r => (r.m.coach || '').trim() === coach && (r.m.regType || '') === '재등록').length, 0);
  const total = newCount + reCount;
  return { newCount, reCount, total, rate: total ? reCount / total : 0 };
}
function coachOptions(){
  const base = (state.instructorOptions || []).map(v => (v || '').trim()).filter(Boolean);
  const fromMembers = memberIncomeRows().map(r => (r.coach || '').trim()).filter(Boolean);
  const fromManual = extraIncomeRows().map(r => (r.coach || '').trim()).filter(Boolean);
  return [...new Set(base.concat(fromMembers, fromManual))];
}
function coachRevenueByMonth(year, coach){
  const { start, end } = monthRange(year, 0); // placeholder for lint-like environments
  return Array.from({length: 12}, (_, monthIndex) => {
    const range = monthRange(year, monthIndex);
    const memberRevenue = memberIncomeRows().reduce((sum, r) => sum + (r.coach === coach && inRange(r.date, range.start, range.end) ? (Number(r.received) || 0) : 0), 0);
    const manualRevenue = extraIncomeRows().reduce((sum, r) => sum + (r.coach === coach && inRange(r.date, range.start, range.end) ? (Number(r.amount) || 0) : 0), 0);
    return memberRevenue + manualRevenue;
  });
}
function selectedCoachList(){
  const options = coachOptions();
  let current = Array.isArray(state.selectedCoachChart) ? state.selectedCoachChart : (state.selectedCoachChart ? [state.selectedCoachChart] : []);
  current = current.filter(v => options.includes(v));
  if (!current.length && options.length) current = [options[0]];
  state.selectedCoachChart = current;
  return current;
}
function selectedCoach(){

}
function updateSelectedCoachChart(value){

  current = current.includes(value) ? current.filter(v => v !== value) : current.concat(value);
  if (!current.length && options.length) current = [options[0]];
  state.selectedCoachChart = [...new Set(current.filter(v => options.includes(v)))];

}
function getMemberFilters(){
  const defaults = {coach:'전체', status:'전체', product:'전체', regType:'전체'};
  const current = state.memberFilters && typeof state.memberFilters === 'object' ? state.memberFilters : {};
  return {...defaults, ...current};
}
function updateMemberFilter(field, value){
  state.memberFilters = {...getMemberFilters(), [field]: value};
  scheduleRecalc(true);
}
function memberFilterOptions(field){
  const filters = getMemberFilters();
  const current = filters[field] || '';
  const values = {
    coach: [...new Set((state.instructorOptions || []).concat(state.members.map(m => m.coach || ''), current).filter(Boolean))],
    status: [...new Set(state.members.map((m, idx) => memberDerived(m, idx).status).concat(current).filter(Boolean))],
    product: [...new Set((state.priceTable || []).map(r => r.product || '').concat(state.members.map(m => m.product || ''), current).filter(Boolean))],
    regType: [...new Set((state.memberTypes || []).concat(state.members.map((m, idx) => memberRegistrationType(m, idx)), current).filter(Boolean))],
  };
  return ['전체', ...values[field]];
}
function memberMatchesFilters(m, idx, d, regType, filters){
  if (filters.coach && filters.coach !== '전체' && (m.coach || '') !== filters.coach) return false;
  if (filters.status && filters.status !== '전체' && (d.status || '') !== filters.status) return false;
  if (filters.product && filters.product !== '전체' && (m.product || '') !== filters.product) return false;
  if (filters.regType && filters.regType !== '전체' && (regType || '') !== filters.regType) return false;
  return true;
}

}

function addMemberReRegistration(idx){
  ensureMemberGroups();
  const source = state.members[idx];
  if (!source) return;
  const groupId = source.memberGroupId || makeMemberGroupId();
  const history = state.members.filter(m => m.memberGroupId === groupId);
  const nextRound = history.reduce((mx, m) => Math.max(mx, Number(m.regRound) || 0), 0) + 1;
  const copy = {
    ...JSON.parse(JSON.stringify(source)),
    memberGroupId: groupId,
    regType: '재등록',
    regRound: nextRound,
    start: '',
    end: '',
    used: '',
  };
  state.members.push(copy);
  pendingFocus = { oninput: `updateMember(${state.members.length - 1}, 'start', this.value)`, selectionStart: 0, selectionEnd: 0 };
  scheduleRecalc(true);
}

  row[field] = (field === 'amount') ? parseNumericInput(value) : value;
  markInputDirty();
}
function updateManualIncome(idx, field, value){

    const defaultPrice = getPrice(defaultProduct);
    state.members.push({name:'',phone:'',regType:'신규',start:'',end:'',product:defaultProduct,total:defaultPrice ? (Number(defaultPrice.total) || 0) : '',used:'',coach:state.instructorOptions[0]||state.selectedCoachChart||''});
    const idx = state.members.length - 1;

  } else if (kind === 'expense'){
    state.expenses.push({date:'',category:state.expenseCategories[0]||'기타',item:'',amount:'',method:state.paymentMethods[0]||'',note:''});
    const idx = state.expenses.length - 1;
    pendingFocus = { oninput: `updateExpense(${idx}, 'date', this.value)`, selectionStart: 0, selectionEnd: 0 };
  } else if (kind === 'manualIncome'){
    state.manualIncomes.push({date:'',item:'',amount:'',method:state.paymentMethods[0]||'',coach:'',type:state.incomeTypes[0]||'기타',note:''});
    const idx = state.manualIncomes.length - 1;
    pendingFocus = { oninput: `updateManualIncome(${idx}, 'date', this.value)`, selectionStart: 0, selectionEnd: 0 };
  } else if (kind === 'price'){
    state.priceTable.push({product:'',total:'',price:'',unit:'',days:'',refund:'',note:''});
    const idx = state.priceTable.length - 1;
    pendingFocus = { oninput: `updatePrice(${idx}, 'product', this.value)`, selectionStart: 0, selectionEnd: 0 };
  } else if (kind === 'codeCommon'){
    state.paymentMethods.push('');
    state.expenseCategories.push('');
    state.incomeTypes.push('');
    state.memberTypes.push('');
    const idx = state.paymentMethods.length - 1;
    pendingFocus = { oninput: `updateCode(0, ${idx}, this.value)`, selectionStart: 0, selectionEnd: 0 };
  } else if (kind === 'coachOption'){
    state.instructorOptions.push('');
    const idx = state.instructorOptions.length - 1;
    pendingFocus = { oninput: `updateCoachOption(${idx}, this.value)`, selectionStart: 0, selectionEnd: 0 };
  }
  scheduleRecalc(true);
}
function removeRow(kind, idx){
  if (kind === 'member') state.members.splice(idx,1);
  else if (kind === 'expense') state.expenses.splice(idx,1);
  else if (kind === 'manualIncome') state.manualIncomes.splice(idx,1);
  else if (kind === 'price') state.priceTable.splice(idx,1);
  else if (kind === 'codeCommon') {
    state.paymentMethods.splice(idx,1);
    state.expenseCategories.splice(idx,1);
    state.incomeTypes.splice(idx,1);
    state.memberTypes.splice(idx,1);
  }
  else if (kind === 'coachOption') state.instructorOptions.splice(idx,1);
  scheduleRecalc(true);
}

function getSeriesValue(m, key){
  if (key === 'memberRevenue') return m.rev.memberRevenue;
  if (key === 'otherRevenue') return m.rev.otherRevenue;
  if (key === 'totalRevenue') return m.rev.totalRevenue;

function toggleSeries(kind, key){

function buildToggles(kind, containerId){

  `).join('');
}
function drawChart(canvas, series, labels, kind){
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,w,h);
  const pad = {l:48,r:18,t:18,b:34};
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  const active = series.filter(s => s.enabled);
  if (!active.length){
    ctx.fillStyle = '#64748b';
    ctx.font = '14px sans-serif';
    ctx.fillText('표시할 항목을 선택하세요.', 20, 30);
    return;
  }
  const values = [];
  active.forEach(s => s.data.forEach(v => values.push(v)));
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (kind === 'margin') {
    min = Math.min(min, -5);
    max = Math.max(max, 5);
  }
  if (min === max) { min -= 1; max += 1; }
  const range = max - min;
  const zeroY = pad.t + plotH - ((0 - min) / range) * plotH;
  // grid
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  for (let i=0;i<5;i++){
    const y = pad.t + (plotH * i / 4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke();
    const val = max - (range * i / 4);
    ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(kind === 'margin' ? `${val.toFixed(1)}%` : fmtNumber(val), pad.l - 8, y);
  }
  // zero line
  if (min < 0 && max > 0){
    ctx.strokeStyle = '#cbd5e1';
    ctx.beginPath(); ctx.moveTo(pad.l, zeroY); ctx.lineTo(w-pad.r, zeroY); ctx.stroke();
  }
  // x labels
  ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  labels.forEach((lab, i) => {
    const x = pad.l + (plotW * (labels.length === 1 ? 0 : i / (labels.length - 1)));
    ctx.fillText(lab.slice(5), x, h - pad.b + 8);
  });
  active.forEach(s => {
    const pts = s.data.map((v,i) => ({
      x: pad.l + (plotW * (labels.length === 1 ? 0 : i / (labels.length - 1))),
      y: pad.t + plotH - ((v - min) / range) * plotH
    }));
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    pts.forEach((p, idx) => { if (!idx) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.stroke();
    pts.forEach(p => { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2); ctx.fill(); });
  });
}

  const statsEl = document.getElementById(`${prefix}AmountStats`);
  const tableEl = document.getElementById(`${prefix}AmountTable`);

let memberSort = { key: 'group', dir: 'asc' };
let salesSort = { key: 'count', dir: 'desc' };

function toggleSort(stateObj, key, defaultDir='asc'){
  if (stateObj.key === key) stateObj.dir = stateObj.dir === 'asc' ? 'desc' : 'asc';
  else { stateObj.key = key; stateObj.dir = defaultDir; }
  scheduleRecalc(true);
}
function sortArrow(stateObj, key){
  if (stateObj.key !== key) return '↕';
  return stateObj.dir === 'asc' ? '↑' : '↓';
}
function compareValues(a, b, dir='asc'){
  const an = typeof a === 'number' && Number.isFinite(a);
  const bn = typeof b === 'number' && Number.isFinite(b);
  let cmp = 0;
  if (an || bn){
    const av = an ? a : -Infinity;
    const bv = bn ? b : -Infinity;
    cmp = av < bv ? -1 : av > bv ? 1 : 0;
  } else {
    const av = String(a ?? '').trim();
    const bv = String(b ?? '').trim();
    cmp = av.localeCompare(bv, 'ko-KR', {numeric:true, sensitivity:'base'});
  }
  return dir === 'asc' ? cmp : -cmp;
}
function memberGroupSortValue(group, key){
  const rows = group.rows.map(x => x.m);
  const reRows = rows.filter(m => String(m.regType || '').trim() === '재등록' || Number(m.regRound) > 0);
  const base = reRows.length ? reRows[reRows.length - 1] : rows[0];
  const baseIndex = state.members.indexOf(base);
  const d = memberDerived(base, baseIndex);
  switch(key){
    case 'id': return d.id;
    case 'name': return base.name || '';
    case 'phone': return base.phone || '';
    case 'regType': return reRows.length ? '재등록' : (base.regType || '신규');
    case 'round': return Number(base.regRound) || 0;
    case 'product': return base.product || '';
    case 'start': return parseDate(base.start)?.getTime() || 0;
    case 'end': return parseDate(memberValidityEnd(base))?.getTime() || 0;
    case 'total': return Number(base.total) || 0;
    case 'used': return Number(base.used) || 0;
    case 'remain': return Number(d.remain) || 0;
    case 'unit': return Number(d.unit) || 0;
    case 'coach': return base.coach || '';
    case 'status': return d.status || '';
    default: return state.members.indexOf(base);
  }
}
function sortMemberGroups(groups){
  const {key, dir} = memberSort;
  return [...groups].sort((a,b) => compareValues(memberGroupSortValue(a,key), memberGroupSortValue(b,key), dir));
}
function salesSortValue(row, key){
  if (key === 'product') return row.product;
  if (key === 'count') return row.count;
  if (key === 'salesShare') return row.salesShare;
  if (key === 'totalSales') return row.totalSales;
  if (key === 'revenueShare') return row.revenueShare;
  if (key === 'avg') return row.avg;
  if (key === 'type') return row.salesType;
  if (key === 'unitPrice') return row.unitPrice;
  return row.idx;
}
function sortSalesRows(rows){
  const {key, dir} = salesSort;
  return [...rows].sort((a,b)=>compareValues(salesSortValue(a,key), salesSortValue(b,key), dir) || a.idx-b.idx);
}
function salesTypeLabel(row){
  if (!row.count || !row.totalSales) return '판매 없음';
  if (row.salesShare >= row.revenueShare * 1.15) return '고판매형';
  if (row.revenueShare >= row.salesShare * 1.15) return '고단가 매출형';
  return '균형형';
}
function salesTypeClass(type){
  if (type === '고판매형') return 'success';
  if (type === '고단가 매출형') return 'warning';
  if (type === '균형형') return 'neutral';
  return 'neutral';
}

  `;
}

      <td class="input-cell currency">${inputHtml(r.amount, `updateManualIncome(${idx}, 'amount', this.value)`, 'number', '', 1000)} </td>
      <td class="input-cell">${selectHtml('payment', r.method, `updateManualIncome(${idx}, 'method', this.value)`)}</td>
      <td class="input-cell">${selectHtml('coach', r.coach, `updateManualIncome(${idx}, 'coach', this.value)`)}</td>
      <td class="input-cell">${selectHtml('income', r.type, `updateManualIncome(${idx}, 'type', this.value)`)}</td>

        </div>
      </div>
      <div class="subcard" style="margin-bottom:14px;">
        <h3>회원권 자동 연동</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>결제일</th><th>회원명</th><th>회원ID</th><th>상품명</th><th>정가</th>
                <th>할인/조정</th><th>실수납액</th><th>결제수단</th><th>담당자</th><th>수입유형</th><th>비고</th>
              </tr>
            </thead>
            <tbody>${linked}</tbody>
          </table>
        </div>
      </div>
      <div class="subcard">
        <div class="section-title" style="margin-bottom:8px;">
          <div>
            <h3>직접 입력 수입</h3>
            <div class="small">개인레슨, 이벤트, 환불 등 회원권 외 수입을 기록하는 공간입니다.</div>
          </div>
          <button class="btn primary" onclick="addRow('manualIncome')">행 추가</button>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>수입일</th><th>항목</th><th>금액</th><th>결제수단</th><th>담당자</th><th>수입유형</th><th>비고</th><th>삭제</th>

}

          <tbody>${rows}</tbody>
        </table>

function renderSales(){
  const baseSales = state.priceTable.map((p, idx) => {
    const product = p.product || '';
    const productRows = memberIncomeRows().filter(r => r.product === product);
    const count = productRows.filter(r => Number(r.received) > 0).length;
    const totalSales = productRows.reduce((a,r)=>a+(Number(r.received)||0),0);
    const avg = count ? totalSales / count : 0;
    return {
      product,
      unitPrice: Number(p.unit) || ((Number(p.total)||0) > 0 ? (Number(p.price)||0) / (Number(p.total)||1) : 0),
      count,
      totalSales,
      avg,
      idx
    };
  }).filter(r => r.product);

  const totalCount = baseSales.reduce((sum,r)=>sum+r.count,0);
  const totalRevenue = baseSales.reduce((sum,r)=>sum+r.totalSales,0);
  const sales = baseSales.map(r => ({
    ...r,
    salesShare: totalCount ? r.count / totalCount : 0,
    revenueShare: totalRevenue ? r.totalSales / totalRevenue : 0
  })).map(r => ({...r, salesType: salesTypeLabel(r)}));

  const rankedByCount = [...sales].sort((a,b)=>b.count-a.count || b.totalSales-a.totalSales || a.idx-b.idx);
  const rankedByRevenue = [...sales].sort((a,b)=>b.totalSales-a.totalSales || b.count-a.count || a.idx-b.idx);
  const bestSeller = rankedByCount[0];
  const bestRevenue = rankedByRevenue[0];
  const topHighVolume = sales.filter(r => r.salesType === '고판매형').sort((a,b)=>b.count-a.count || b.salesShare-a.salesShare || a.idx-b.idx)[0];
  const topHighValue = sales.filter(r => r.salesType === '고단가 매출형').sort((a,b)=>b.totalSales-a.totalSales || b.avg-a.avg || a.idx-b.idx)[0];
  const rows = sortSalesRows(sales).map((r, index) => {
    const typeClass = salesTypeClass(r.salesType);
    const isBestVolume = bestSeller && r.product === bestSeller.product;
    const isBestRevenue = bestRevenue && r.product === bestRevenue.product;
    return `<tr>
      <td class="center"><strong>${index + 1}</strong></td>
      <td><strong>${escapeHtml(r.product)}</strong>${isBestVolume ? ' <span class="member-round-badge new">판매 1위</span>' : ''}${isBestRevenue ? ' <span class="member-round-badge re">매출 1위</span>' : ''}</td>
      <td class="currency">${plainNumberHtml(r.count)}</td>
      <td class="currency">${plainPctHtml(r.salesShare)}</td>
      <td class="currency">${plainNumberHtml(r.totalSales)}</td>
      <td class="currency">${plainPctHtml(r.revenueShare)}</td>
      <td class="currency">${plainNumberHtml(r.avg)}</td>
      <td class="center"><span class="tag ${typeClass}">${r.salesType}</span></td>
      <td class="currency">${plainNumberHtml(r.unitPrice)}</td>
    </tr>`;
  }).join('');
  const sort = (key, defaultDir='asc') => `onclick="toggleSort(salesSort, '${key}', '${defaultDir}')" style="cursor:pointer;user-select:none;"`;

  return `
    <div class="card">
      <div class="section-title">
        <div>
          <h2>횟수권별매출</h2>
          <div class="note">판매량, 매출기여도, 평균판매가를 비교해 고판매형과 고단가 매출형을 구분합니다. 컬럼을 클릭하면 오름차순/내림차순으로 정렬됩니다.</div>
        </div>
      </div>

      <div class="member-summary-strip" style="margin-bottom:14px;">
        <div><span>판매 1위 상품</span><strong>${escapeHtml(bestSeller?.product || '-')}</strong></div>
        <div><span>판매 1위 건수</span><strong>${plainNumberHtml(bestSeller?.count || 0)}건</strong></div>
        <div><span>고판매형 대표</span><strong>${escapeHtml(topHighVolume?.product || '-')}</strong></div>
        <div><span>고단가 매출형 대표</span><strong>${escapeHtml(topHighValue?.product || '-')}</strong></div>
      </div>

      <div class="muted-box" style="margin-bottom:14px;">
        <strong>상품 성과 해석</strong> · <strong>고판매형</strong>은 판매건수 비중이 매출 비중보다 높은 상품, <strong>고단가 매출형</strong>은 매출 비중이 판매건수 비중보다 높은 상품으로 구분합니다. 두 비중이 비슷한 경우는 <strong>균형형</strong>으로 표시합니다.
        ${bestSeller && bestRevenue ? `현재 판매 1위는 <strong>${escapeHtml(bestSeller.product)}</strong>, 매출 1위는 <strong>${escapeHtml(bestRevenue.product)}</strong>입니다.` : ''}
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th ${sort('product')}>상품명 ${sortArrow(salesSort,'product')}</th>
              <th ${sort('count','desc')}>판매건수 ${sortArrow(salesSort,'count')}</th>
              <th ${sort('salesShare','desc')}>판매비중 ${sortArrow(salesSort,'salesShare')}</th>
              <th ${sort('totalSales','desc')}>총매출 ${sortArrow(salesSort,'totalSales')}</th>
              <th ${sort('revenueShare','desc')}>매출비중 ${sortArrow(salesSort,'revenueShare')}</th>
              <th ${sort('avg','desc')}>평균판매가 ${sortArrow(salesSort,'avg')}</th>
              <th ${sort('type')}>판매형태 ${sortArrow(salesSort,'type')}</th>
              <th ${sort('unitPrice','desc')}>회당가격 ${sortArrow(salesSort,'unitPrice')}</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="9" class="center" style="padding:18px;color:var(--muted);">등록된 횟수권 상품이 없습니다.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderMonthly(){
  const y = Number(state.year) || new Date().getFullYear();
  const months = annualSummary();
  const monthHeads = Array.from({length:12}, (_,i) => `<th>${monthLabel(y,i)}</th>`).join('');
  const row = (label, getter) => `
    <tr>
      <th>${label}</th>
      ${months.map((m,i)=>{ const v = getter(m,i); const isProfit = label === '영업이익'; return `<td class="currency">${isProfit ? signedNumberHtml(v) : plainNumberHtml(v)}</td>`; }).join('')}
    </tr>`;
  const pctRow = (label, getter) => `
    <tr>
      <th>${label}</th>
      ${months.map((m,i)=>{ const v = getter(m,i); return `<td class="currency">${label === '마진율' ? signedPctHtml(v) : plainPctHtml(v)}</td>`; }).join('')}
    </tr>`;
  return `
    <div class="card">
      <div class="section-title">
        <div>
          <h2>월간요약</h2>
          <div class="note">기준연도를 바꾸면 12개월 매출/지출/이익이 즉시 다시 계산됩니다.</div>
        </div>
        <div class="sheet-controls">
          <button class="btn primary" onclick="document.getElementById('yearInput').focus()">연도 수정</button>
        </div>
      </div>
      ${renderSummaryCharts('monthly')}
      <div class="table-wrap" style="margin-top:14px;">
        <table>
          <thead>
            <tr><th>항목</th>${monthHeads}</tr>
          </thead>
          <tbody>
            ${row('회원권매출', m=>m.rev.memberRevenue)}
            ${row('기타수입', m=>m.rev.otherRevenue)}
            ${row('총매출', m=>m.rev.totalRevenue)}
            <tr><td colspan="13" style="background:#f8fbff;height:8px;"></td></tr>
            ${row('임대료', m=>m.exp['임대료'])}
            ${row('관리비', m=>m.exp['관리비'])}
            ${row('인건비', m=>m.exp['인건비'])}
            ${row('광고비', m=>m.exp['광고비'])}
            ${row('소모품비', m=>m.exp['소모품비'])}
            ${row('기타지출', m=>m.exp['기타'])}
            ${row('총지출', m=>m.exp.totalExpense)}
            <tr><td colspan="13" style="background:#f8fbff;height:8px;"></td></tr>
            ${row('영업이익', m=>m.profit)}
            ${pctRow('마진율', m=>m.margin)}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function renderKpis(){
  const rev = revenueYTD();
  const exp = expenseYTD();
  const profit = profitYTD();
  const margin = marginYTD();
  const stats = memberRegistrationStats();
  const cards = [
    ['회원 수', fmtNumber(totalMemberCount()), `활성 ${fmtNumber(activeMemberCount())} · 만료 ${fmtNumber(expiredMemberCount())} · 소진 ${fmtNumber(soldOutMemberCount())}`],
    ['신규', fmtNumber(stats.newCount), '회원구분 기준'],
    ['재등록', fmtNumber(stats.reCount), '회원구분 기준'],
    ['재등록율', plainPctHtml(stats.rate), '재등록 / 전체 등록'],
    ['연매출', fmtNumber(rev), `기준연도 ${state.year}`],
    ['영업이익 / 마진율', `${signedNumberHtml(profit)} · ${signedPctHtml(margin)}`, `연지출 ${fmtNumber(exp)}`],
  ];
  return cards.map(([label, value, sub])=>`
    <div class="kpi">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
      <div class="sub">${sub}</div>
    </div>
  `).join('');
}
function renderSheets(){
  return `
    <div class="sheet ${activeTab==='overview'?'active':''}" data-sheet="overview">${renderOverview()}</div>
    <div class="sheet ${activeTab==='codes'?'active':''}" data-sheet="codes">${renderCodes()}</div>
    <div class="sheet ${activeTab==='prices'?'active':''}" data-sheet="prices">${renderPrices()}</div>
    <div class="sheet ${activeTab==='members'?'active':''}" data-sheet="members">${renderMembers()}</div>
    <div class="sheet ${activeTab==='income'?'active':''}" data-sheet="income">${renderIncome()}</div>
    <div class="sheet ${activeTab==='expenses'?'active':''}" data-sheet="expenses">${renderExpenses()}</div>
    <div class="sheet ${activeTab==='sales'?'active':''}" data-sheet="sales">${renderSales()}</div>
    <div class="sheet ${activeTab==='monthly'?'active':''}" data-sheet="monthly">${renderMonthly()}</div>
  `;
}
function recalc(){
  const snapshot = captureUiState();
  syncMemberValidityAll();
  const coachList = coachOptions();
  let selectedCoaches = Array.isArray(state.selectedCoachChart) ? state.selectedCoachChart : (state.selectedCoachChart ? [state.selectedCoachChart] : []);
  selectedCoaches = selectedCoaches.filter(v => coachList.includes(v));
  if (!selectedCoaches.length && coachList.length) selectedCoaches = [coachList[0]];
  state.selectedCoachChart = selectedCoaches;
  document.getElementById('yearInput').value = state.year;
  document.getElementById('todayInfo').value = fmtDate(todayDate());
  document.getElementById('kpiRow').innerHTML = renderKpis();
  document.getElementById('sheets').innerHTML = renderSheets();
  document.getElementById('tabs').innerHTML = renderTabs();
  document.querySelectorAll('.sheet').forEach(el => el.classList.toggle('active', el.dataset.sheet === activeTab));
  const active = [...document.querySelectorAll('.tab')].find(b => b.textContent === sheetLabels[activeTab]);
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === active));
  scheduleChartRender();
  restoreUiState(snapshot);
  saveState();
}
document.getElementById('yearInput').addEventListener('input', e => updateYear(e.target.value));
window.addEventListener('resize', () => scheduleChartRender());
ensureMemberGroups();
recalc();
initSupabase();
</script>
