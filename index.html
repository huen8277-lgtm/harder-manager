
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>하더 센터 운영관리 - HTML 버전</title>
<style>
  :root{
    --bg:#f5f7fb;
    --panel:#ffffff;
    --line:#d9e1ec;
    --line2:#e7edf5;
    --text:#1f2937;
    --muted:#6b7280;
    --primary:#1d4ed8;
    --primary-soft:#e8f0ff;
    --success:#0f766e;
    --warning:#b45309;
    --danger:#b91c1c;
    --shadow:0 10px 30px rgba(15, 23, 42, .08);
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:linear-gradient(180deg, #f7f9fd 0%, #eef3f9 100%);
    color:var(--text);
    font-family:Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  html, body, .app, .card, .table-wrap{overflow-anchor:none;}
  .app{max-width:1700px;margin:0 auto;padding:24px}
  .topbar{
    display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .brand{
    display:flex;flex-direction:column;gap:6px;
  }
  .brand h1{margin:0;font-size:28px;letter-spacing:-0.03em}
  .brand p{margin:0;color:var(--muted)}
  .pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .pill{
    background:var(--primary-soft);
    color:var(--primary);
    border:1px solid #cfe0ff;
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:700;
  }
  .actions{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap
  }
  .control{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    box-shadow:var(--shadow);
  }
  .control label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .control input,.control select,.control textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 10px;
    font:inherit;
    background:#fff;
    color:var(--text);
    outline:none;
  }
  .control input:focus,.control select:focus,.control textarea:focus{
    border-color:#9db7ff; box-shadow:0 0 0 3px rgba(59,130,246,.12)
  }
  .tabs{
    display:flex;gap:8px;flex-wrap:wrap;
    margin:16px 0;
  }
  .tab{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    border-radius:999px;
    padding:10px 14px;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(15,23,42,.04);
    font-weight:700;
  }
  .tab.active{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:16px;
  }
  .kpis{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:12px;
  }
  @media (max-width: 1200px){
    .kpis{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media (max-width: 700px){
    .kpis{grid-template-columns:1fr;}
  }
  .kpi{
    background:linear-gradient(180deg, #fff 0%, #fbfcff 100%);
    border:1px solid var(--line2);
    border-radius:16px;
    padding:16px;
  }
  .kpi .label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .kpi .value{font-size:24px;font-weight:800;letter-spacing:-0.03em}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:6px}
  .sheet{
    display:none;
    animation:fade .15s ease-out;
  }
  .sheet.active{display:block}
  @keyframes fade{from{opacity:.6;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
  .section-title{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-bottom:10px
  }
  .section-title h2{margin:0;font-size:20px;letter-spacing:-0.02em}
  .section-title .note{color:var(--muted);font-size:13px}
  .table-wrap{
    overflow:auto;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    min-width:100%;
  }
  th, td{
    border-bottom:1px solid var(--line2);
    padding:8px 10px;
    vertical-align:middle;
    white-space:nowrap;
  }
  thead th{
    position:sticky;
    top:0;
    z-index:2;
    background:#f8fbff;
    font-size:13px;
    text-align:left;
    border-bottom:1px solid var(--line);
  }
  tbody tr:hover td{background:#fbfdff}
  td.input-cell input, td.input-cell select, td.input-cell textarea{
    width:100%;
    min-width:110px;
    border:1px solid #d7e2f0;
    border-radius:10px;
    padding:8px 9px;
    font:inherit;
    background:#fff;
  }
  td.input-cell textarea{min-width:180px;min-height:38px;resize:vertical}
  td.computed{
    background:#f8fafc;
    color:#0f172a;
    font-weight:700;
  }
  td.muted{color:var(--muted)}
  .small{font-size:12px;color:var(--muted)}
  .section-grid{
    display:grid;gap:14px;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  @media (max-width: 1100px){
    .section-grid{grid-template-columns:1fr;}
  }
  .subcard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
  }
  .subcard h3{margin:0 0 10px 0;font-size:16px}
  .btn{
    border:1px solid var(--line);
    background:#fff;
    padding:9px 12px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
  }
  .btn.primary{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
  }
  .btn.ghost{
    background:#fff;
  }
  .row-tools{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px
  }
  .tag{
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;
    font-size:12px;font-weight:700;border:1px solid var(--line);
  }
  .tag.success{background:#ecfdf5;color:var(--success);border-color:#a7f3d0}
  .tag.warning{background:#fffbeb;color:var(--warning);border-color:#fde68a}
  .tag.danger{background:#fef2f2;color:var(--danger);border-color:#fecaca}
  .tag.neutral{background:#f8fafc;color:#334155;border-color:#dbe5f1}
  .notes-list{
    display:grid;gap:10px;line-height:1.65
  }
  .notes-list ul{margin:0;padding-left:18px}
  .notes-list li{margin:4px 0}
  .muted-box{
    background:#f8fbff;border:1px solid #dce8f8;border-radius:14px;padding:12px;color:#475569
  }
  .footer-space{height:40px}
  .right{margin-left:auto}
  .mini-input{width:110px}
  .currency{text-align:right}
  .center{text-align:center}
  .status-badge{
    display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700
  }
  .s-이용중{background:#ecfdf5;color:#047857}
  .s-예정{background:#eff6ff;color:#1d4ed8}
  .s-만료{background:#fef3c7;color:#92400e}
  .s-소진{background:#fee2e2;color:#b91c1c}
  .s-재등록필요{background:#ffedd5;color:#c2410c}
  .s-입력전{background:#f3f4f6;color:#4b5563}
  .member-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:12px 0 14px}
  .filter-item{display:flex;flex-direction:column;gap:6px;min-width:170px}
  .filter-item label{font-size:12px;font-weight:700;color:#6b7280}
  .filter-item select{width:100%;min-width:170px}
  .sheet-controls{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px
  }
  .sheet-controls .control{box-shadow:none}
  .sticky-top{
    position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
    background:rgba(245,247,251,.82);padding-bottom:10px;
  }
  .nowrap{white-space:nowrap}

  .chart-grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));}
  @media (max-width: 1100px){.chart-grid{grid-template-columns:1fr;}}
  .chart-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;}
  .chart-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .chart-head h3{margin:0;font-size:16px;}
  .series-toggles{display:flex;gap:8px;flex-wrap:wrap}
  .coach-inline{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;max-width:100%;}
  .coach-inline .coach-label{font-weight:600;color:#111827;}
  .coach-inline .coach-rate{font-weight:700;color:#374151;}
  .coach-inline select{min-width:150px;max-width:180px;}
  .series-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;user-select:none;}
  .series-toggle input{margin:0}
  .chart-wrap{position:relative;width:100%;height:300px;border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);overflow:hidden;}
  .chart-canvas{width:100%;height:100%;display:block;}
  .legend-note{font-size:12px;color:var(--muted);}
  .positive,.signed-positive{color:#dc2626;font-weight:800;}
  .negative,.signed-negative{color:#2563eb;font-weight:800;}


  /* Cleaner UI overrides */
  body{
    background:linear-gradient(180deg, #f8fafc 0%, #eef3f9 100%);
  }
  .app{
    max-width:1640px;
    padding:20px;
  }
  .sticky-top{
    position:sticky;
    top:0;
    z-index:20;
    backdrop-filter:blur(12px);
    background:rgba(248,250,252,.86);
    padding:14px 0 12px;
    margin:0 -20px 10px;
    padding-left:20px;
    padding-right:20px;
    border-bottom:1px solid rgba(217,225,236,.75);
  }
  .topbar{
    gap:12px;
    margin-bottom:14px;
    align-items:center;
  }
  .brand h1{
    font-size:26px;
    line-height:1.15;
  }
  .brand p{font-size:13px;}
  .actions{
    gap:10px;
    align-items:stretch;
  }
  .control{
    box-shadow:none;
    border-radius:16px;
    padding:12px 13px;
    min-width:unset;
  }
  .control label{
    margin-bottom:8px;
    font-size:11px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .control input,.control select,.control textarea{
    border-radius:11px;
    min-height:40px;
    background:#fff;
  }
  .control input::placeholder,.control textarea::placeholder{color:#94a3b8;}
  .btn{
    border-radius:11px;
    min-height:38px;
    padding:9px 12px;
    box-shadow:none;
    transition:transform .06s ease, box-shadow .12s ease, border-color .12s ease, background-color .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .tabs{
    margin:12px 0 0;
    padding-bottom:2px;
  }
  .tab{
    border-radius:999px;
    padding:9px 13px;
    box-shadow:none;
    background:#fff;
  }
  .card{
    border-radius:22px;
    padding:20px;
    margin-bottom:14px;
  }
  .section-title{
    margin-bottom:12px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line2);
  }
  .section-title h2{font-size:19px;}
  .section-title .note{font-size:12px;}
  .subcard{
    border-radius:18px;
    background:#fbfdff;
  }
  .subcard h3{font-size:15px;}
  .kpis{
    gap:10px;
  }
  .kpi{
    border-radius:18px;
    padding:15px;
  }
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:.02em;}
  .kpi .value{font-size:22px;}
  .table-wrap{
    border-radius:16px;
    box-shadow:none;
    background:#fff;
  }
  th, td{
    padding:9px 11px;
    font-size:13px;
  }
  thead th{
    background:#f8fbff;
    font-size:12px;
    letter-spacing:.01em;
  }
  tbody tr:hover td{background:#f8fbff;}
  td.input-cell input, td.input-cell select, td.input-cell textarea{
    min-width:100px;
    border-radius:10px;
    padding:7px 9px;
  }
  td.input-cell textarea{min-width:160px;}
  .sheet-controls .control,
  .member-filters .filter-item{
    box-shadow:none;
  }
  .chart-card{
    border-radius:18px;
    padding:12px;
  }
  .chart-wrap{
    border-radius:12px;
  }
  .chart-head h3{font-size:15px;}
  .legend-note{font-size:11px;}
  .status-badge{padding:4px 8px;}
  .small{line-height:1.55;}
  .notes-list{line-height:1.6;}
  .muted-box{border-radius:12px;}
  .footer-space{height:24px;}

</style>

async function attachSupabaseState(){
  if (!supabaseClient || !supabaseSession) return;
  detachSupabaseState();
  try {
    setSyncStatus('Supabase 동기화 중...');
    const { data, error } = await supabaseClient
      .from(SUPABASE_STATE_TABLE)
      .select('data, updated_at')
      .eq('id', SUPABASE_STATE_ID)
      .maybeSingle();
    if (error) throw error;

    if (data && data.data) {
      state = normalizeState(data.data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      scheduleRecalc(true);
      setSyncStatus('Supabase 불러오기 완료 · 자동 저장 중', 'good');
    } else {
      await pushSupabaseState(true);
      setSyncStatus('Supabase 새 저장소 생성 · 자동 저장 중', 'good');
    }

    supabaseReady = true;
    supabaseChannel = supabaseClient
      .channel('app_state_default')
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: SUPABASE_STATE_TABLE,
        filter: `id=eq.${SUPABASE_STATE_ID}`,
      }, payload => {
        const incoming = payload && payload.new && payload.new.data ? payload.new.data : null;
        if (!incoming) return;
        const next = normalizeState(incoming);
        if (JSON.stringify(next) === JSON.stringify(state)) return;
        state = next;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
        scheduleRecalc(true);
        setSyncStatus('Supabase 실시간 반영 · 자동 저장 중', 'good');

    console.error(err);

  }

      .from(SUPABASE_STATE_TABLE)
      .upsert(payload, { onConflict: 'id' });

function isTextEditingElement(el){
  if (!el || !['INPUT','TEXTAREA'].includes(el.tagName)) return false;
  if (el.tagName === 'TEXTAREA') return true;
  const t = (el.type || '').toLowerCase();
  return ['text','search','url','tel','email','password'].includes(t);
}

function scheduleRecalc(force = false, delay = 650){
  const active = typeof document !== 'undefined' ? document.activeElement : null;
  const editingText = isTextEditingElement(active);

  if ((isComposing || editingText) && !force) {
    if (isComposing) pendingDuringComposition = true;
    if (editingText) pendingTextRender = true;
    saveState();
    return;
  }
  pendingDuringComposition = false;
  pendingTextRender = false;
  if (recalcTimer) clearTimeout(recalcTimer);
  recalcTimer = setTimeout(() => {
    recalcTimer = 0;
    recalc();
  }, force ? 0 : delay);
}

if (typeof document !== 'undefined') {
  document.addEventListener('compositionstart', (e) => {
    if (e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) isComposing = true;
  }, true);
  document.addEventListener('compositionend', (e) => {
    if (e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) {
      isComposing = false;
      if (pendingDuringComposition) scheduleRecalc(true);
    }
  }, true);
  document.addEventListener('blur', (e) => {
    if (isTextEditingElement(e.target) && pendingTextRender) {
      pendingTextRender = false;
      scheduleRecalc(true);
    }
  }, true);
}

function pad(n, len){

}

function parseDate(v){
  if (!v) return null;
  if (v instanceof Date && !isNaN(v)) return v;
  const s = String(v).trim();
  if (!s) return null;
  const d = new Date(s.includes('T') ? s : s + 'T00:00:00');
  return isNaN(d) ? null : d;
}
function fmtDate(v){

function captureUiState(){
  const active = document.activeElement;
  const focus = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName) ? {
    oninput: active.getAttribute('oninput') || '',
    tagName: active.tagName,
    type: active.type || '',
    selectionStart: typeof active.selectionStart === 'number' ? active.selectionStart : null,
    selectionEnd: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
  } : null;
  const wraps = [...document.querySelectorAll('.table-wrap')].map(el => ({top: el.scrollTop, left: el.scrollLeft}));
  return { focus, wraps, windowY: window.scrollY || 0 };
}
function restoreUiState(snapshot){
  const wraps = [...document.querySelectorAll('.table-wrap')];
  wraps.forEach((el, idx) => {
    const pos = snapshot.wraps[idx];
    if (!pos) return;
    el.scrollTop = pos.top;
    el.scrollLeft = pos.left;
  });
  const targetSpec = pendingFocus || snapshot.focus;
  pendingFocus = null;
  if (targetSpec && targetSpec.oninput){
    const target = [...document.querySelectorAll('input,select,textarea')].find(el => el.getAttribute('oninput') === targetSpec.oninput);
    if (target){
      try { target.focus({preventScroll:true}); } catch(e) { target.focus(); }
      if (targetSpec.selectionStart !== null && typeof target.setSelectionRange === 'function' && target.tagName === 'INPUT' && ['text','search','url','tel','password','email','number'].includes(target.type)) {
        try { target.setSelectionRange(targetSpec.selectionStart, targetSpec.selectionEnd ?? targetSpec.selectionStart); } catch(e) {}
      } else if (targetSpec.selectionStart !== null && typeof target.setSelectionRange === 'function' && target.tagName === 'TEXTAREA') {
        try { target.setSelectionRange(targetSpec.selectionStart, targetSpec.selectionEnd ?? targetSpec.selectionStart); } catch(e) {}
      }
    }
  }
}
function monthStart(y,m0){

function addDays(dateObj, days){

function memberValidityDays(m){

function memberValidityEnd(m){

function memberDerived(m, idx){
  const total = Number(m.total) || 0;
  const used = Number(m.used) || 0;
  const remain = Math.max(0, total - used);
  const priceRow = getPrice(m.product);
  const price = priceRow ? Number(priceRow.price) || 0 : 0;
  const unit = total > 0 ? price / total : 0;
  let status = '';
  const name = (m.name || '').trim();

}
function monthRange(year, monthIndex){

function inRange(dateValue, start, end){

function memberIncomeRows(){

function revenueSummaryForMonth(year, monthIndex){
  const { start, end } = monthRange(year, monthIndex);
  const memberRevenue = memberIncomeRows().reduce((sum, r) => sum + (inRange(r.date, start, end) ? (Number(r.received)||0) : 0), 0);
  const otherRevenue = extraIncomeRows().reduce((sum, r) => sum + (inRange(r.date, start, end) ? (Number(r.amount)||0) : 0), 0);
  return { memberRevenue, otherRevenue, totalRevenue: memberRevenue + otherRevenue };
}
function expenseSummaryForMonth(year, monthIndex){
  const { start, end } = monthRange(year, monthIndex);
  const cats = ['임대료','관리비','인건비','광고비','소모품비','기타'];
  const out = Object.fromEntries(cats.map(c => [c, 0]));
  state.expenses.forEach(r => {
    if (!inRange(r.date, start, end)) return;
    const amt = Number(r.amount) || 0;
    if (cats.includes(r.category)) out[r.category] += amt;
    else out['기타'] += amt;
  });
  const totalExpense = Object.values(out).reduce((a,b)=>a+b,0);
  return {...out, totalExpense};
}
function annualSummary(){

  const months = Array.from({length:12}, (_,i) => {
    const rev = revenueSummaryForMonth(y,i);

function memberRegistrationType(m, idx){
  const explicit = (m.regType || '').trim();
  if (explicit) return explicit;
  const name = (m.name || '').trim();
  const phone = (m.phone || '').trim();
  if (!name && !phone) return '';
  for (let i = 0; i < idx; i++){
    const prev = state.members[i] || {};
    const prevName = (prev.name || '').trim();
    const prevPhone = (prev.phone || '').trim();
    if ((name && prevName && name === prevName) || (phone && prevPhone && phone === prevPhone)){
      return '재등록';
    }
  }
  return '신규';
}
function memberRegistrationStats(){
  const rows = state.members.filter(m => (m.name || '').trim() || (m.phone || '').trim());
  const newCount = rows.filter((m, idx) => memberRegistrationType(m, state.members.indexOf(m)) === '신규').length;
  const reCount = rows.filter((m, idx) => memberRegistrationType(m, state.members.indexOf(m)) === '재등록').length;
  const total = newCount + reCount;
  return { newCount, reCount, total, rate: total ? reCount / total : 0 };

  const newCount = rows.filter((m, idx) => memberRegistrationType(m, state.members.indexOf(m)) === '신규').length;

function drawChart(canvas, series, labels, kind){
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,w,h);
  const pad = {l:48,r:18,t:18,b:34};
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  const active = series.filter(s => s.enabled);
  if (!active.length){
    ctx.fillStyle = '#64748b';
    ctx.font = '14px sans-serif';
    ctx.fillText('표시할 항목을 선택하세요.', 20, 30);
    return;
  }
  const values = [];
  active.forEach(s => s.data.forEach(v => values.push(v)));
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (kind === 'margin') {
    min = Math.min(min, -5);
    max = Math.max(max, 5);
  }
  if (min === max) { min -= 1; max += 1; }
  const range = max - min;
  const zeroY = pad.t + plotH - ((0 - min) / range) * plotH;
  // grid
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  for (let i=0;i<5;i++){
    const y = pad.t + (plotH * i / 4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke();
    const val = max - (range * i / 4);
    ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(kind === 'margin' ? `${val.toFixed(1)}%` : fmtNumber(val), pad.l - 8, y);
  }
  // zero line
  if (min < 0 && max > 0){
    ctx.strokeStyle = '#cbd5e1';
    ctx.beginPath(); ctx.moveTo(pad.l, zeroY); ctx.lineTo(w-pad.r, zeroY); ctx.stroke();
  }
  // x labels
  ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  labels.forEach((lab, i) => {
    const x = pad.l + (plotW * (labels.length === 1 ? 0 : i / (labels.length - 1)));
    ctx.fillText(lab.slice(5), x, h - pad.b + 8);
  });
  active.forEach(s => {
    const pts = s.data.map((v,i) => ({
      x: pad.l + (plotW * (labels.length === 1 ? 0 : i / (labels.length - 1))),
      y: pad.t + plotH - ((v - min) / range) * plotH
    }));
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    pts.forEach((p, idx) => { if (!idx) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.stroke();
    pts.forEach(p => { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2); ctx.fill(); });
  });
}

  const commitEvt = 'oninput';
  return `<input class="${cls}" type="${renderType}" value="${escapeHtml(v)}" ${commitEvt}="${oninput}"${inputMode}${stepAttr}${textAttrs} />`;
}

            ${row('총매출', m=>m.rev.totalRevenue)}
            <tr><td colspan="13" style="background:#f8fbff;height:8px;"></td></tr>
            ${row('임대료', m=>m.exp['임대료'])}
            ${row('관리비', m=>m.exp['관리비'])}
            ${row('인건비', m=>m.exp['인건비'])}
            ${row('광고비', m=>m.exp['광고비'])}
            ${row('소모품비', m=>m.exp['소모품비'])}
            ${row('기타지출', m=>m.exp['기타'])}
            ${row('총지출', m=>m.exp.totalExpense)}
            <tr><td colspan="13" style="background:#f8fbff;height:8px;"></td></tr>
            ${row('영업이익', m=>m.profit)}
            ${pctRow('마진율', m=>m.margin)}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function renderKpis(){
  const rev = revenueYTD();
  const exp = expenseYTD();
  const profit = profitYTD();
  const margin = marginYTD();
  const stats = memberRegistrationStats();
  const cards = [
    ['회원 수', fmtNumber(totalMemberCount()), `활성 ${fmtNumber(activeMemberCount())} · 만료 ${fmtNumber(expiredMemberCount())} · 소진 ${fmtNumber(soldOutMemberCount())}`],
    ['신규', fmtNumber(stats.newCount), '회원구분 기준'],
    ['재등록', fmtNumber(stats.reCount), '회원구분 기준'],
    ['재등록율', plainPctHtml(stats.rate), '재등록 / 전체 등록'],
    ['연매출', fmtNumber(rev), `기준연도 ${state.year}`],
    ['영업이익 / 마진율', `${signedNumberHtml(profit)} · ${signedPctHtml(margin)}`, `연지출 ${fmtNumber(exp)}`],
  ];
  return cards.map(([label, value, sub])=>`
    <div class="kpi">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
      <div class="sub">${sub}</div>
    </div>
  `).join('');
}
function renderSheets(){
  return `
    <div class="sheet ${activeTab==='overview'?'active':''}" data-sheet="overview">${renderOverview()}</div>
    <div class="sheet ${activeTab==='codes'?'active':''}" data-sheet="codes">${renderCodes()}</div>
    <div class="sheet ${activeTab==='prices'?'active':''}" data-sheet="prices">${renderPrices()}</div>
    <div class="sheet ${activeTab==='members'?'active':''}" data-sheet="members">${renderMembers()}</div>
    <div class="sheet ${activeTab==='income'?'active':''}" data-sheet="income">${renderIncome()}</div>
    <div class="sheet ${activeTab==='expenses'?'active':''}" data-sheet="expenses">${renderExpenses()}</div>
    <div class="sheet ${activeTab==='sales'?'active':''}" data-sheet="sales">${renderSales()}</div>
    <div class="sheet ${activeTab==='monthly'?'active':''}" data-sheet="monthly">${renderMonthly()}</div>
  `;
}
function recalc(){
  const snapshot = captureUiState();
  syncMemberValidityAll();
  const coachList = coachOptions();
  if (state.selectedCoachChart && !coachList.includes(state.selectedCoachChart)) {
    state.selectedCoachChart = coachList[0] || '';
  }
  if (!state.selectedCoachChart) state.selectedCoachChart = coachList[0] || '';
  document.getElementById('yearInput').value = state.year;
  document.getElementById('todayInfo').value = fmtDate(todayDate());
  document.getElementById('kpiRow').innerHTML = renderKpis();
  document.getElementById('sheets').innerHTML = renderSheets();
  document.getElementById('tabs').innerHTML = renderTabs();
  document.querySelectorAll('.sheet').forEach(el => el.classList.toggle('active', el.dataset.sheet === activeTab));
  const active = [...document.querySelectorAll('.tab')].find(b => b.textContent === sheetLabels[activeTab]);
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === active));
  scheduleChartRender();
  restoreUiState(snapshot);
  saveState();
}
document.getElementById('yearInput').addEventListener('input', e => updateYear(e.target.value));
window.addEventListener('resize', () => scheduleChartRender());
recalc();
initSupabase();
</script>
</body>
</html>
